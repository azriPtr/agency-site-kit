# Claude review: reads the PR diff against the client's facts and brief and
# the kit's rules, then comments. It advises; it does not approve, block, edit
# or push. The human reviewer answers or fixes each comment.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for the Claude token
        id: token
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Claude review skipped: add the CLAUDE_CODE_OAUTH_TOKEN secret (claude setup-token) to enable it."; fi
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The base branch is origin/${{ github.base_ref }}.

            Follow .claude/skills/site-review/SKILL.md exactly. It defines what to check
            and how to report. Post inline comments for findings tied to a line. Then write
            the summary to /tmp/claude-review.md and post it with
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/claude-review.md`.
            Do not edit files, commit or push.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Agent,Edit(//tmp/**),Bash(git diff *),Bash(git log *),Bash(git show *),Bash(gh pr view *),Bash(gh pr comment *),mcp__github_inline_comment__create_inline_comment"

      # What the reviewer read and said, kept for 14 days. Useful when a comment needs explaining.
      - name: Keep the review transcript
        if: always() && steps.token.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: claude-review-transcript
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 14
          if-no-files-found: ignore
